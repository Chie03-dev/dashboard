apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: dashboard
data:
  dashboard-observability.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "id": 1,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "green", "index": 0, "text": "OK"}}, "type": "value"},
                {"options": {"1": {"color": "red", "index": 1, "text": "DOWN"}}, "type": "value"}
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"], "fields": ""},
            "textMode": "auto",
            "text": {}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "up{job=\"dashboard-api\"}",
              "legendFormat": "API",
              "refId": "A"
            }
          ],
          "title": "API Status",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "green", "index": 0, "text": "OK"}}, "type": "value"},
                {"options": {"1": {"color": "red", "index": 1, "text": "DOWN"}}, "type": "value"}
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"], "fields": ""},
            "textMode": "auto",
            "text": {}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "celery_workers",
              "legendFormat": "Workers",
              "refId": "A"
            }
          ],
          "title": "Celery Workers",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "red", "value": 100}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"], "fields": ""},
            "textMode": "auto",
            "text": {}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "celery_queue_length",
              "legendFormat": "{{queue}}",
              "refId": "A"
            }
          ],
          "title": "Celery Queue Length",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.9},
                  {"color": "red", "value": 1}
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"], "fields": ""},
            "textMode": "auto",
            "text": {}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "rate(dashboard_http_requests_total{status=~\"5..\"}[5m]) / rate(dashboard_http_requests_total[5m])",
              "legendFormat": "5xx Rate",
              "refId": "A"
            }
          ],
          "title": "HTTP 5xx Rate",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "rate(dashboard_http_requests_total[5m])",
              "legendFormat": "{{method}} {{endpoint}} {{status}}",
              "refId": "A"
            }
          ],
          "title": "HTTP Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(dashboard_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "{{method}} {{endpoint}}",
              "refId": "A"
            }
          ],
          "title": "HTTP Latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "id": 7,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "rate(dashboard_external_api_errors_total[5m])",
              "legendFormat": "{{api}} - {{error_type}}",
              "refId": "A"
            }
          ],
          "title": "External API Error Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "id": 8,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(dashboard_external_api_latency_seconds_bucket[5m]))",
              "legendFormat": "{{api}}",
              "refId": "A"
            }
          ],
          "title": "External API Latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "id": 9,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(dashboard_sync_duration_seconds_bucket[5m]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Sync Job Duration (p95)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "id": 10,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "increase(dashboard_sync_success_total[5m])",
              "legendFormat": "{{job}} success",
              "refId": "A"
            },
            {
              "expr": "increase(dashboard_sync_failure_total[5m])",
              "legendFormat": "{{job}} failure",
              "refId": "B"
            }
          ],
          "title": "Sync Success/Failure Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
          "id": 11,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "rate(dashboard_cache_hits_total[5m])",
              "legendFormat": "{{cache}} hits",
              "refId": "A"
            },
            {
              "expr": "rate(dashboard_cache_misses_total[5m])",
              "legendFormat": "{{cache}} misses",
              "refId": "B"
            }
          ],
          "title": "Cache Hit/Miss Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "id": 12,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "rate(dashboard_llm_tokens_used_total[5m])",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "title": "LLM Tokens Used Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 36},
          "id": 13,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "celery_tasks_total",
              "legendFormat": "{{task}} {{status}}",
              "refId": "A"
            }
          ],
          "title": "Celery Tasks",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 36},
          "id": 14,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(celery_task_duration_seconds_bucket[5m]))",
              "legendFormat": "{{task}}",
              "refId": "A"
            }
          ],
          "title": "Celery Task Duration (p95)",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 44},
          "id": 15,
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLines": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true
          },
          "pluginVersion": "10.2.0",
          "targets": [
            {
              "expr": "{job=\"dashboard\"} |~ \"ERROR|WARN\"",
              "legendFormat": "Errors/Warnings",
              "refId": "A"
            }
          ],
          "title": "Recent Errors & Warnings",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["dashboard", "observability"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Dashboard Application - Observability",
      "uid": "dashboard-observability",
      "version": 1,
      "weekStart": ""
    }