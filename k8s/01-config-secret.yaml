apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: dashboard
data:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/dashboard"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  LLM_BASE_URL: "http://ollama:11434/v1"
  LLM_MODEL: "llama3.1"
  FETCH_TIMEOUT: "20"
  SCHEDULER_HOURS: "3"
  HN_LIMIT: "15"
  REMINDER_HOURS: "2"
  REDIS_ENABLED: "true"
  CACHE_TTL_WEATHER: "600"
  CACHE_TTL_DEALS: "3600"
  CACHE_TTL_HN: "1800"
  CACHE_TTL_GITHUB: "1800"
  CACHE_TTL_DIGEST: "86400"
  CACHE_TTL_GAMES: "1800"
  RATE_LIMIT_GAMERPOWER: "10"
  RATE_LIMIT_EPIC: "10"
  RATE_LIMIT_HN: "30"
  RATE_LIMIT_GITHUB: "30"
  RATE_LIMIT_CHEAPSHARK: "10"
  RATE_LIMIT_OPENMETEO: "60"
  RATE_LIMIT_LLM: "20"
  SYNC_MAX_RETRIES: "3"
  SYNC_RETRY_BASE_DELAY: "2.0"
  SYNC_RETRY_MAX_DELAY: "60.0"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
  LLM_TOKEN_BUDGET_PER_TENANT: "100000"
  LLM_MODEL_FALLBACK_CHAIN: "gpt-3.5-turbo,gpt-4,claude-3-haiku"
  LLM_SEMANTIC_CACHE_TTL: "86400"
  OTEL_SERVICE_NAME: "dashboard"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secrets
  namespace: dashboard
type: Opaque
stringData:
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_KEY"
  LLM_API_KEY: "YOUR_LLM_API_KEY_HERE"
  GITHUB_TOKEN: "YOUR_GITHUB_TOKEN_HERE"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "smtp_user"
  SMTP_PASS: "smtp_password"
  SMTP_FROM: "dashboard@example.com"
  SMTP_TO: "admin@example.com"
  NTFY_URL: "https://ntfy.sh/your-topic"
  POSTGRES_PASSWORD: "postgres"
  GRAFANA_PASSWORD: "admin"
  REDIS_PASSWORD: ""