global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true
    ntfy_configs:
      - topic: 'dashboard-alerts'
        title: '{{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        priority: 3

  - name: 'critical'
    email_configs:
      - to: 'oncall@example.com'
        send_resolved: true
    ntfy_configs:
      - topic: 'dashboard-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        priority: 5
        tags: ['warning', 'rotating_light']

  - name: 'warning'
    ntfy_configs:
      - topic: 'dashboard-warnings'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        priority: 3
        tags: ['warning']

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']