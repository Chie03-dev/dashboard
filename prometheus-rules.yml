groups:
  - name: dashboard.rules
    interval: 30s
    rules:
      # Sync failures
      - alert: DashboardSyncFailed
        expr: increase(dashboard_sync_failure_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dashboard sync job failed"
          description: "Sync job {{ $labels.job }} failed {{ $value }} times in the last 5 minutes. Error: {{ $labels.error }}"

      - alert: DashboardSyncDurationHigh
        expr: histogram_quantile(0.95, rate(dashboard_sync_duration_seconds_bucket[5m])) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dashboard sync taking too long"
          description: "Sync job {{ $labels.job }} 95th percentile duration is {{ $value | humanizeDuration }}"

      # External API errors
      - alert: DashboardExternalAPIErrorsHigh
        expr: rate(dashboard_external_api_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High external API error rate"
          description: "API {{ $labels.api }} error rate is {{ $value | humanizePercentage }}"

      - alert: DashboardExternalAPILatencyHigh
        expr: histogram_quantile(0.95, rate(dashboard_external_api_latency_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High external API latency"
          description: "API {{ $labels.api }} 95th percentile latency is {{ $value | humanizeDuration }}"

      # LLM token budget
      - alert: DashboardLLMBudgetExceeded
        expr: |
          (
            sum by (tenant_id) (increase(dashboard_llm_tokens_used_total[30d]))
            > 
            (100000 * 0.9)
          )
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "LLM token budget near limit"
          description: "Tenant {{ $labels.tenant_id }} has used >90% of monthly token budget"

      - alert: DashboardLLMBudgetCritical
        expr: |
          (
            sum by (tenant_id) (increase(dashboard_llm_tokens_used_total[30d]))
            > 
            100000
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM token budget exceeded"
          description: "Tenant {{ $labels.tenant_id }} has exceeded monthly token budget"

      # Cache hit ratio
      - alert: DashboardCacheHitRatioLow
        expr: |
          (
            rate(dashboard_cache_hits_total[5m]) 
            / 
            (rate(dashboard_cache_hits_total[5m]) + rate(dashboard_cache_misses_total[5m]))
          ) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache hit ratio below 50%"
          description: "Cache {{ $labels.cache }} hit ratio is {{ $value | humanizePercentage }}"

      # HTTP errors
      - alert: DashboardHTTPErrorsHigh
        expr: |
          (
            sum by (endpoint) (rate(dashboard_http_requests_total{status=~"5.."}[5m]))
            /
            sum by (endpoint) (rate(dashboard_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Endpoint {{ $labels.endpoint }} 5xx rate is {{ $value | humanizePercentage }}"

      - alert: DashboardHTTPLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(dashboard_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP latency"
          description: "Endpoint {{ $labels.endpoint }} 95th percentile latency is {{ $value | humanizeDuration }}"

      # Celery worker health
      - alert: DashboardCeleryWorkersDown
        expr: celery_workers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No Celery workers running"
          description: "No Celery workers are registered"

      - alert: DashboardCeleryQueueBacklog
        expr: celery_queue_length > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending tasks"

      - alert: DashboardCeleryTaskFailureRate
        expr: |
          (
            sum by (task) (rate(celery_tasks_total{status="FAILURE"}[5m]))
            /
            sum by (task) (rate(celery_tasks_total[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Celery task failure rate"
          description: "Task {{ $labels.task }} failure rate is {{ $value | humanizePercentage }}"

      # Database
      - alert: DashboardDatabaseDown
        expr: up{job="dashboard-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dashboard API down"
          description: "Dashboard API has been down for more than 1 minute"

      - alert: DashboardDatabaseConnectionsHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connections near limit"
          description: "Database is using {{ $value | humanizePercentage }} of max connections"

      # Redis
      - alert: DashboardRedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis down"
          description: "Redis has been down for more than 1 minute"

      - alert: DashboardRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory"

      # Dead letter queue
      - alert: DashboardDLQNotEmpty
        expr: dead_letter_queue_length > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue has entries"
          description: "DLQ has {{ $value }} failed fetch entries awaiting retry"