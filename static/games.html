<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Games — Personal Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0c10'/></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="btn btn--ghost" href="/static/index.html">← Dashboard</a>
      <h1>Free Games</h1>
    </div>
    <div class="widget__controls">
      <label class="field"><span>Category</span>
        <select id="catFilter"><option value="">All</option></select>
      </label>
      <label class="field"><span>Sort</span>
        <select id="gameSort">
          <option value="created">Newest</option>
          <option value="platform">Platform</option>
          <option value="end">Ending soon</option>
          <option value="title">Title</option>
        </select>
      </label>
    </div>
  </header>
  <main class="page">
    <div id="games" class="grid" aria-live="polite"></div>
  </main>
  <script src="/static/games.js"></script>
</body>
</html>
